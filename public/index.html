<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="自分の予定をまとめるカレンダー">
<title>Calendar Hub — 予定をひとつに</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <div class="brand">Calendar Hub</div>
    <h1>予定をひとつに。</h1>
    <p>Googleアカウントでログインしてください。</p>
    <a class="primary" id="loginLink" href="/auth/google/login?return_to=%2F">Googleでログイン</a>
    <div class="gate-error" id="gateError" hidden></div>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="sidebar">
    <div class="brand">Calendar Hub</div>
    <button class="new" id="create">＋ 予定を作成</button>
    <div>
      <div class="section-title">MY CALENDARS</div>
      <div class="item"><i class="dot"></i>仕事</div>
      <div class="item"><i class="dot red"></i>個人</div>
      <div class="item"><i class="dot blue"></i>チーム</div>
    </div>
    <div class="side-actions">
      <div class="section-title">DATA</div>
      <button class="ghost-btn" id="importButton" type="button">旧Calendar Hubから取り込む</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
    <div class="side-foot" id="sideFoot">個人用カレンダー</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="crumb">カレンダー　/　すべての予定</div>
      <div class="top-actions">
        <input class="search" id="search" type="search" placeholder="⌕　予定を検索" aria-label="予定を検索">
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <button class="new" id="create2">＋ 新しい予定</button>
        <button class="ghost-btn" id="logout" type="button">ログアウト</button>
      </div>
    </header>
    <section class="content">
      <div class="heading">
        <div>
          <div class="eyebrow">YOUR TIME, TOGETHER</div>
          <h1 id="headingPeriod"></h1>
          <p>予定をひとつに。余白もいっしょに。</p>
        </div>
        <div class="view" role="group" aria-label="表示切替">
          <button data-view="month" class="active">月</button><button data-view="week">週</button><button data-view="day">日</button>
        </div>
      </div>
      <div class="status" id="status" hidden></div>
      <div class="workspace">
        <div>
          <div class="panel calendar-scroll">
            <div class="calendar-inner" id="calendar">
              <div class="calendar-head">
                <div class="tools"><button id="prev" aria-label="前へ">‹</button><button id="today">今日</button><button id="next" aria-label="次へ">›</button></div>
                <div class="period" id="period"></div>
                <span aria-hidden="true"></span>
              </div>
              <div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
              <div class="days" id="days"></div>
            </div>
          </div>
          <div class="footer" id="footer">時間は端末のタイムゾーンで表示</div>
        </div>
        <aside class="panel agenda">
          <h2>選択日の予定</h2>
          <div class="date" id="agendaDate"></div>
          <div id="agendaRows"></div>
        </aside>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="formHeading">
  <form class="form" id="form">
    <h2 id="formHeading">予定を作成</h2>
    <label for="title">タイトル</label><input id="title" maxlength="120" required placeholder="例：チーム週次">
    <label for="date">日付</label><input id="date" type="date" required>
    <div class="row" id="timeFields">
      <div><label for="start">開始</label><input id="start" type="time" value="10:00"></div>
      <div><label for="end">終了</label><input id="end" type="time" value="11:00"></div>
    </div>
    <div class="hint" id="timeHint">終了は開始より後の同日内に設定してください。</div>
    <label class="checkbox"><input id="allDay" type="checkbox"> 終日</label>
    <label for="category">分類</label>
    <select id="category"><option value="work">仕事</option><option value="personal">個人</option><option value="team">チーム</option></select>
    <label for="notes">メモ（任意）</label><textarea id="notes" maxlength="2000"></textarea>
    <div class="actions"><button type="button" id="cancel">キャンセル</button><button class="save" type="submit" id="save">保存</button></div>
  </form>
</div>

<div id="detail" class="detail" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="detail-card">
    <button id="detailClose" class="detail-close" aria-label="閉じる">×</button>
    <div class="eyebrow">EVENT DETAILS</div>
    <h2 id="detailTitle"></h2>
    <p id="detailMeta" style="white-space:pre-wrap"></p>
    <div class="detail-actions"><button id="detailEdit">編集</button><button id="detailDelete" class="delete">削除</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
