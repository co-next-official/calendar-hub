<body><div class="app"><aside class="sidebar"><div class="brand">Calendar Hub</div><button class="new" id="create">＋ 予定を作成</button><div><div class="section-title">MY CALENDARS</div><div class="item"><i class="dot"></i>仕事</div><div class="item"><i class="dot red"></i>個人</div><div class="item"><i class="dot blue"></i>チーム</div></div><div class="side-foot">個人用カレンダー<br>予定はChatGPTアカウントに保存されます。</div></aside><main class="main"><header class="topbar"><div class="crumb">カレンダー　/　すべての予定</div><div class="top-actions"><input class="search" id="search" type="search" placeholder="⌕　予定を検索" aria-label="予定を検索"><div class="avatar" aria-hidden="true">あ</div><button class="new" id="create2">＋ 新しい予定</button><a class="new" href="/signout-with-chatgpt?return_to=%2F" target="_top">サインアウト</a></div></header><section class="content"><div class="heading"><div><div class="eyebrow">YOUR TIME, TOGETHER</div><h1 id="headingPeriod"></h1><p>予定をひとつに。余白もいっしょに。</p></div><div class="view" role="group" aria-label="表示切替"><button data-view="month" class="active">月</button><button data-view="week">週</button><button data-view="day">日</button></div></div><div class="status"><b>アカウント保存</b>　予定はあなたのChatGPTアカウントに保存されます。共有・招待機能は未実装です。</div><div id="migration" class="status" hidden></div><div class="workspace"><div><div class="panel calendar-scroll"><div class="calendar-inner" id="calendar"><div class="calendar-head"><div class="tools"><button id="prev" aria-label="前へ">‹</button><button id="today">今日</button><button id="next" aria-label="次へ">›</button></div><div class="period" id="period"></div><span aria-hidden="true"></span></div><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div class="days" id="days"></div></div></div><div class="footer">時間は端末のローカルタイムゾーンで表示 · 予定はアカウントに保存されます</div></div><aside class="panel agenda"><h2 id="agendaTitle">選択日の予定</h2><div class="date" id="agendaDate"></div><div id="agendaRows"></div></aside></div></section></main></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="formHeading"><form class="form" id="form"><h2 id="formHeading">予定を作成</h2><label for="title">タイトル</label><input id="title" maxlength="120" required placeholder="例：チーム週次"><label for="date">日付</label><input id="date" type="date" required><div class="row" id="timeFields"><div><label for="start">開始</label><input id="start" type="time" value="10:00" required></div><div><label for="end">終了</label><input id="end" type="time" value="11:00" required></div></div><div class="hint" id="timeHint">終了は開始より後の同日内に設定してください。</div><label class="checkbox"><input id="allDay" type="checkbox"> 終日</label><label for="visibility">分類</label><select id="visibility"><option value="work">仕事</option><option value="personal">個人</option><option value="team">チーム</option></select><div class="actions"><button type="button" id="cancel">キャンセル</button><button class="save" type="submit">この端末に保存</button></div></form></div>
<div id="detail" class="detail" role="dialog" aria-modal="true" aria-hidden="true"><div class="detail-card"><button id="detailClose" class="detail-close" aria-label="閉じる">×</button><div class="eyebrow">EVENT DETAILS</div><h2 id="detailTitle"></h2><p id="detailMeta"></p><div class="detail-actions"><button id="detailEdit">編集</button><button id="detailDelete" class="delete">削除</button></div></div></div>
<script>
(async()=>{'use strict';const KEY='calendarHubEvents';const $=id=>document.getElementById(id);const daysEl=$('days'),calendar=$('calendar'),modal=$('modal'),form=$('form');const today=new Date();today.setHours(0,0,0,0);let selected=new Date(today),anchor=new Date(today),view='month',events=[],editingId=null,activeId=null,mutating=false,draftId=null,loadError=false;const validDate=s=>{if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const [y,m,d]=s.split('-').map(Number),v=new Date(y,m-1,d);return v.getFullYear()===y&&v.getMonth()===m-1&&v.getDate()===d};const validTime=s=>typeof s==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(s);function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(v))return [];return v.filter(x=>x&&typeof x==='object'&&typeof x.id==='string'&&typeof x.title==='string'&&x.title.length<=120&&validDate(x.date)&&['work','personal','team'].includes(x.category)&&typeof x.allDay==='boolean'&&(x.allDay||(validTime(x.start)&&validTime(x.end)&&x.end>x.start)));}catch{return []}}async function persist(next){const oldById=new Map(events.map(e=>[e.id,e]));const nextIds=new Set(next.map(e=>e.id));for(const old of events)if(!nextIds.has(old.id)){const r=await fetch('/api/events/'+encodeURIComponent(old.id),{method:'DELETE'});if(!r.ok)throw new Error((await r.json()).error||'削除に失敗しました')}const canonical=[];for(const item of next){const old=oldById.get(item.id);if(old&&JSON.stringify(old)===JSON.stringify(item)){canonical.push(old);continue}const r=await fetch(old?'/api/events/'+encodeURIComponent(item.id):'/api/events',{method:old?'PATCH':'POST',headers:{'content-type':'application/json'},body:JSON.stringify(old?{...item,updatedAt:old.updatedAt}:item)});const result=await r.json();if(!r.ok)throw new Error(result.error||'保存に失敗しました');canonical.push(result.event)}return canonical}function keyDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function
