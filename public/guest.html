<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>予定へのお誘い — Calendar Hub</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<style>
  .guest{min-height:100vh;display:grid;place-items:center;padding:16px}
  .guest-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;width:min(460px,100%);box-shadow:0 20px 60px #17362c14}
  .guest-card h1{font-size:22px;margin:8px 0 4px;overflow-wrap:anywhere}
  .guest-when{font-weight:700;margin:10px 0}
  .guest-notes{color:var(--muted);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
  .guest-card input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:16px;margin:6px 0 12px}
  .guest-actions{display:flex;gap:8px}
  .guest-actions button{flex:1;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font:inherit}
  .guest-actions button.on{background:var(--green);color:#fff;border-color:var(--green)}
  .guest-responses{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.8}
  .guest-error{color:var(--red)}
</style>
</head>
<body>
<main class="guest">
  <div class="guest-card" id="card">
    <div class="eyebrow">CALENDAR HUB</div>
    <p id="loading">読み込み中…</p>
  </div>
</main>
<script type="module" src="/guest.js"></script>
</body>
</html>
